[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sororail/contracts"
homepage = "https://github.com/sororail"
rust-version = "1.91"

[workspace.dependencies]
# Latest stable as of 2026-09-07. 28.0.0-rc.1 exists on crates.io but is a
# prerelease -- do not pin it.
soroban-sdk = "27.0.6"
sororail-common = { path = "contracts/common", version = "0.1.0" }

# Money math must trap on overflow rather than wrap or saturate, in release
# builds as well as debug. See contracts/common/src/math.rs.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
