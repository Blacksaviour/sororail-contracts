name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs get the repo default scope unless overridden below.
# Only the audit job gets more (checks: write for rustsec/audit-check).
permissions:
  contents: read

jobs:
  conventional-commits:
    name: conventional commits
    runs-on: ubuntu-latest
    # PR title becomes the squash-merge commit, so that is what we validate.
    # SPEC.md and CONTRIBUTING.md require Conventional Commits.
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace

  build:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      # sororail-integration-tests is host-only (needs std); it is excluded
      # here rather than being allowed to fail the wasm build.
      - run: cargo build --workspace --exclude sororail-integration-tests --target wasm32v1-none --release
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: target/wasm32v1-none/release/*.wasm

  coverage:
    name: coverage (>=90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Pinned to match rust-toolchain.toml so coverage numbers cannot
          # drift when stable moves. Keep in sync by hand.
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - run: cargo llvm-cov nextest --workspace --fail-under-lines 90

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
