name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lint policy (deny warnings, checked arithmetic) lives in [workspace.lints]
# in Cargo.toml, not in RUSTFLAGS, so local `cargo clippy` matches CI.
env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs get the repo default scope unless overridden below.
# Only the audit job gets more (checks: write for rustsec/audit-check).
permissions:
  contents: read

jobs:
  conventional-commits:
    name: conventional commits
    runs-on: ubuntu-latest
    # PR title becomes the squash-merge commit, so that is what we validate.
    # SPEC.md and CONTRIBUTING.md require Conventional Commits.
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo nextest run --workspace

  build:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      # sororail-integration-tests is host-only (needs std); it is excluded
      # here rather than being allowed to fail the wasm build.
      - run: cargo build --workspace --exclude sororail-integration-tests --target wasm32v1-none --release
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: target/wasm32v1-none/release/*.wasm
      # Rust tests never load the contract spec, so a broken one (e.g. the
      # `Payments` alias in DEPLOYMENTS.md) passes everything above. `make
      # specs` generates each interface and fails if it does not parse or
      # references an undefined type. Action tag == CLI version; keep in step
      # with DEPLOYMENTS.md.
      - uses: stellar/stellar-cli@v27.1.0
      - run: make specs
      - uses: actions/upload-artifact@v4
        with:
          name: specs
          path: dist/specs/*.json

  msrv:
    name: msrv (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Must equal rust-version in Cargo.toml.
          toolchain: "1.91"
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check --workspace --exclude sororail-integration-tests --target wasm32v1-none --locked

  coverage:
    name: coverage (>=90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Pinned to match rust-toolchain.toml so coverage numbers cannot
          # drift when stable moves. Keep in sync by hand.
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - run: cargo llvm-cov nextest --workspace --fail-under-lines 90

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
